- title: Experience
  type: time_table
  contents:
    - title: Research Assistant
      institution: Intelligent Assistive Machines (IAM) Lab, University of Maryland
      year: 2023 - Present
      description:
        - Supervised by <a href = "https://scholar.google.com/citations?user=El-R5MEAAAAJ">Dr. Hernisa Kacorri</a>.
        - Designing and evaluating deep learning models on wearable IMU time-series data for human activity recognition (HAR) with older adults.
        - Developing personalized, teachable activity trackers that empower older adults to train models to their own needs and behaviors.
        - title: Research Topics
          contents:
            - Personalized activity recognition for older adults using smartwatch IMU sensors.
            - Ground-truth data collection in naturalistic settings for HAR model training and evaluation.
            - Teachable AI interfaces enabling non-expert end-users to adapt activity recognition models.
            - Data-driven optimal IMU placement for human pose estimation.
    - title: IoT Network Engineer
      institution: <a href = "https://vicinia.io/">Vicinia</a>
      year: Summer 2022
      description:
        - Design and development of a wireless network for real-time location tracking of assets through two-layer edge architecture.
        - title: Impacts
          contents:
            - 50% reduction in network coverage cost.
            - Lowered hardware and infrastructure requirements.

    - title: Data Analyst, Network Performance Engineer
      institution: <a href = "https://irancell.ir/en/home">MTN</a>
      year: 2020 - 2021
      description:
        - title: Projects
          contents:
            - Automation of network performance report generation.
            - Data analysis for network planning.
            - Network KPIs monitoring and reporting.
        - title: Technologies
          contents:
            - Python, SQL, Tableau, Pandas, Hadoop, Spark

    - title: Senior Hardware Engineer
      institution: <a href = "https://arshon.com/">Arshon Technology</a>
      year: 2020 - 2021
      description:
        - title: Project
          contents:
            - Designed and developed the hardware of an industrial IoT gateway at Arshon Technology.
        - title: Skills
          contents:
            - Circuit and PCB Design (Altium Designer)

    - title: Head of Embedded Systems Team
      institution: <a href = "http://sarveentech.ir/">Sarveen Technologies</a>
      year: 2016 - 2020
      description:
        - Headed the embedded systems team delivering hardware, firmware, and wireless protocols across a full suite of AI-enabled livestock health monitoring devices.
        - Owned procurement, manufacturing, and production for all hardware products; planned development timelines in collaboration with product managers and the sales team.
        - Collaborated with ML, software, product management, and industrial design teams to drive end-to-end product delivery.
        - title: Products
          contents:
            - "SmartTag: Ultra-low-power wearable for dairy cow activity recognition."
            - "MilkMeter: An electronic non-mechanical milk yield measurement device."
            - "E-nose: An electronic nose for detecting cows exhaled gases."
            - "ForcePlate: A walk-over weigh scale for measuring cows' weight."
        - title: Skills
          contents:
            - Team Leadership & Project Management
            - Circuit and PCB Design (Altium Designer)
            - Embedded Programming (RTOS, C/C++)
            - Wireless IoT Protocols (BLE, Zigbee, LoRa, WiFi)
            - Signal Processing
            - Manufacturing & Procurement

